<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design System Brief Builder</title>
<style>
  :root{
    --accent:#2563eb;
    --accent-dark:#1d4ed8;
    --ink:#1f2937;
    --ink-soft:#6b7280;
    --line:#e5e7eb;
    --bg:#f8fafc;
    --panel:#ffffff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  header.topbar h1{font-size:17px;margin:0;font-weight:700;}
  .topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select,button,input,textarea{font:inherit;}
  select,input[type=text],input[type=number],input[type=tel],textarea{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;color:var(--ink);}
  textarea{width:100%;resize:vertical;min-height:64px;}
  button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;font-weight:600;color:var(--ink);}
  button.primary{background:var(--accent);border-color:var(--accent-dark);color:#fff;}
  button.primary:hover{background:var(--accent-dark);}
  button.danger{color:#b91c1c;border-color:#fecaca;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  nav.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:19;}
  nav.steps .pill{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  nav.steps .pill.active{background:var(--accent);border-color:var(--accent-dark);color:#fff;}
  nav.steps .pill.clickable{cursor:pointer;}
  main.layout{display:grid;grid-template-columns:1fr 360px;gap:20px;max-width:1280px;margin:20px auto;padding:0 20px;align-items:start;}
  @media (max-width: 900px){ main.layout{grid-template-columns:1fr;} }
  section.form-pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;min-height:360px;}
  section.form-pane h2{margin-top:0;font-size:19px;}
  section.form-pane .hint{color:var(--ink-soft);font-size:13px;margin-top:-6px;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--ink);}
  .field .sub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .field input[type=text],.field input[type=number],.field input[type=tel],.field select,.field textarea{width:100%;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row .field{flex:1 1 160px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media (max-width:640px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
  table.tokens{width:100%;border-collapse:collapse;margin-bottom:8px;}
  table.tokens th,table.tokens td{border:1px solid var(--line);padding:6px 8px;font-size:12.5px;text-align:left;}
  table.tokens th{background:#f3f4f6;}
  table.tokens input{width:64px;padding:4px 6px;}
  .color-field{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .color-field input[type=color]{width:40px;height:32px;border:1px solid var(--line);border-radius:6px;padding:0;background:#fff;}
  .color-field label{min-width:140px;font-size:13px;font-weight:600;}
  .page-block{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .page-block summary{cursor:pointer;font-weight:700;font-size:14.5px;}
  .page-block .sections-list{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;}
  .page-block .sections-list label{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:5px;background:#f3f4f6;padding:4px 9px;border-radius:999px;}
  .image-thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
  .image-thumbs .thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .image-thumbs .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .image-thumbs .thumb button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;padding:0;}
  aside.preview-pane{position:sticky;top:120px;}
  .preview-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;}
  .preview-wrap h2{margin:0 0 10px;font-size:14px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .preview-card{border-radius:10px;padding:20px;transition:background .15s,color .15s;}
  .preview-swatches{display:flex;gap:6px;margin-bottom:12px;}
  .preview-swatches .sw{width:26px;height:26px;border-radius:6px;border:1px solid rgba(0,0,0,.08);}
  .prev-btn{border:none;display:inline-block;margin-top:12px;cursor:default;}
  .prev-mini-card{margin-top:14px;}
  footer.wizard-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1280px;margin:0 auto 40px;padding:0 20px;}
  footer.wizard-footer span{font-size:13px;color:var(--ink-soft);font-weight:600;}
  #briefOutput{width:100%;min-height:360px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;}
  .output-actions{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;}
  .toast{position:fixed;bottom:18px;right:18px;background:#111827;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>Design System Brief Builder</h1>
    <div class="topbar-actions">
      <select id="draftSelect" title="Load a saved client draft"></select>
      <button id="btnSaveDraft" title="Save current form as a named draft">Save As…</button>
      <button id="btnDeleteDraft" title="Delete selected draft" class="danger">Delete</button>
      <button id="btnReset" title="Clear the form back to defaults" class="danger">Reset</button>
    </div>
  </header>

  <nav class="steps" id="stepsNav"></nav>

  <main class="layout">
    <section class="form-pane" id="formPane"></section>
    <aside class="preview-pane">
      <div class="preview-wrap">
        <h2>Live preview</h2>
        <div class="preview-card" id="previewCard">
          <div class="preview-swatches">
            <span class="sw" id="swPrimary"></span>
            <span class="sw" id="swSecondary"></span>
            <span class="sw" id="swNeutral900"></span>
            <span class="sw" id="swNeutral100"></span>
          </div>
          <div id="prevHeadline">Your Business Name</div>
          <p id="prevBody">Sample body text showing your chosen font, size and color for a quick look at the design.</p>
          <button class="prev-btn" id="prevButton">Call Now</button>
          <div class="prev-mini-card" id="prevMiniCard">
            <strong style="display:block;margin-bottom:4px;">Mini card</strong>
            <span style="font-size:13px;">Card radius, padding and shadow preview.</span>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <footer class="wizard-footer">
    <button id="btnPrev">← Back</button>
    <span id="stepLabel"></span>
    <button id="btnNext" class="primary">Next →</button>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var LS_AUTOSAVE = 'dsbb:autosave:v1';
var LS_DRAFTS = 'dsbb:drafts:v1';

var COLOR_PRESETS = {
  trustworthyBlue: { primary:'#1d4ed8', secondary:'#f59e0b', neutral900:'#111827', neutral100:'#f3f4f6', bg:'#ffffff', text:'#1f2937' },
  warmLocal:        { primary:'#b45309', secondary:'#1d4ed8', neutral900:'#1c1917', neutral100:'#faf5f0', bg:'#fffaf5', text:'#292524' },
  freshGreen:        { primary:'#15803d', secondary:'#0ea5e9', neutral900:'#14532d', neutral100:'#f0fdf4', bg:'#ffffff', text:'#1f2937' },
  boldRed:           { primary:'#b91c1c', secondary:'#1f2937', neutral900:'#111827', neutral100:'#fef2f2', bg:'#ffffff', text:'#1f2937' },
  elegantDark:       { primary:'#d4af37', secondary:'#9ca3af', neutral900:'#0b0b0b', neutral100:'#1a1a1a', bg:'#0f0f0f', text:'#f5f5f5' }
};
var COLOR_PRESET_LABELS = {
  trustworthyBlue:'Trustworthy Blue', warmLocal:'Warm Local', freshGreen:'Fresh Green', boldRed:'Bold Red', elegantDark:'Elegant Dark'
};

var TYPO_DEFAULTS = {
  h1:   {desktop:40,tablet:34,mobile:28,weight:700,lh:1.2},
  h2:   {desktop:32,tablet:28,mobile:24,weight:700,lh:1.25},
  h3:   {desktop:24,tablet:22,mobile:20,weight:600,lh:1.3},
  h4:   {desktop:20,tablet:19,mobile:18,weight:600,lh:1.4},
  h5:   {desktop:18,tablet:17,mobile:16,weight:600,lh:1.4},
  h6:   {desktop:14,tablet:14,mobile:14,weight:600,lh:1.4},
  lead: {desktop:20,tablet:18,mobile:16,weight:400,lh:1.6},
  body: {desktop:16,tablet:16,mobile:16,weight:400,lh:1.6},
  small:{desktop:14,tablet:14,mobile:13,weight:400,lh:1.5}
};
var TYPO_LABELS = {h1:'H1',h2:'H2',h3:'H3',h4:'H4',h5:'H5',h6:'H6 (eyebrow/label)',lead:'Lead / subtitle',body:'Body paragraph',small:'Small / caption'};
var TYPO_ORDER = ['h1','h2','h3','h4','h5','h6','lead','body','small'];

var PAGES_CONFIG = {
  home:      { label:'Home', variants:['Centered hero','Split hero (image + text)','Full-background image hero'],
               sections:[{key:'hero',label:'Hero'},{key:'trustBar',label:'Trust bar (reviews / years in business)'},{key:'servicesPreview',label:'Services preview'},{key:'whyUs',label:'Why choose us'},{key:'testimonialsPreview',label:'Testimonials preview'},{key:'galleryPreview',label:'Gallery preview'},{key:'cta',label:'Call-to-action'}] },
  about:     { label:'About', variants:['Story-first layout','Team-first layout'],
               sections:[{key:'story',label:'Our story'},{key:'team',label:'Team'},{key:'whyUs',label:'Why choose us'},{key:'credentials',label:'Credentials / certifications'},{key:'cta',label:'CTA'}] },
  services:  { label:'Services (index + each service page, same structure)', variants:['Grid of service cards','List with icons'],
               sections:[{key:'indexGrid',label:'Services index (grid/list of all services)'},{key:'detailIntro',label:'Per-service: intro'},{key:'detailBenefits',label:'Per-service: benefits'},{key:'detailProcess',label:'Per-service: process / how it works'},{key:'detailFaq',label:'Per-service: FAQ'},{key:'detailCta',label:'Per-service: CTA'}] },
  serviceAreas:{ label:'Service Area pages (one per area, same structure)', variants:['Same template repeated per area'],
               sections:[{key:'areaIntro',label:'Area intro (city / neighborhood name)'},{key:'areaServices',label:'Services offered in this area'},{key:'areaTrust',label:'Local trust signals'},{key:'areaCta',label:'CTA with click-to-call'}] },
  testimonials:{ label:'Testimonials', variants:['Grid layout','Carousel / slider'],
               sections:[{key:'grid',label:'Testimonial grid'},{key:'featured',label:'Featured review'},{key:'cta',label:'CTA'}] },
  contact:   { label:'Contact', variants:['Form + map side-by-side','Form only, map below'],
               sections:[{key:'form',label:'Contact form'},{key:'callButton',label:'Click-to-call button (prominent)'},{key:'mapAddress',label:'Address / map'},{key:'hours',label:'Business hours'}] },
  gallery:   { label:'Gallery / Portfolio', variants:['Grid','Masonry'],
               sections:[{key:'grid',label:'Image grid of past work'}] }
};
var PAGE_ORDER = ['home','about','services','serviceAreas','testimonials','contact','gallery'];

function buildDefaultPages(){
  var pages = {};
  PAGE_ORDER.forEach(function(id){
    var cfg = PAGES_CONFIG[id];
    var sections = {};
    cfg.sections.forEach(function(s){ sections[s.key] = true; });
    pages[id] = { include:true, variant:cfg.variants[0], notes:'', sections:sections };
  });
  return pages;
}

function defaultState(){
  return {
    client: { businessName:'', phone:'', address:'', hours:'', goals:'', audience:'', currentSite:'', referenceSites:'', services:'', serviceAreas:'' },
    brand: { tone:'', likes:'', dislikes:'', fontName:'Inter', lookDescription:'', referenceImages:[] },
    colors: (function(){ var p = JSON.parse(JSON.stringify(COLOR_PRESETS.trustworthyBlue)); p.preset='trustworthyBlue'; p.mode='light'; return p; })(),
    typography: JSON.parse(JSON.stringify(TYPO_DEFAULTS)),
    layout: { containerMax:1200, gridCols:12, gridGap:24, gridGapMobile:16, gutterDesktop:24, gutterMobile:16, spacingScale:'4, 8, 12, 16, 24, 32, 48, 64, 96, 128', sectionPaddingDesktop:96, sectionPaddingTablet:64, sectionPaddingMobile:48, breakpointMobile:640, breakpointTablet:1024 },
    effects: { radius:12, shadow:'soft', borderWidth:1, borderColor:'#e5e7eb' },
    components: { buttonHeightDesktop:48, buttonHeightMobile:44, buttonRadius:8, buttonPaddingX:28, buttonFontWeight:600, inputHeight:48, cardRadius:12, cardPadding:28, callButtonStyle:'floatingMobile', iconStyle:'outline', avatarShape:'circle' },
    pages: buildDefaultPages(),
    motion: { enableMotion:true, hoverStyle:'lift', scrollAnimation:'fadeUp' },
    output: { buildTarget:'htmlCss' }
  };
}

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function getPath(obj, path){
  return path.split('.').reduce(function(o,k){ return (o==null ? undefined : o[k]); }, obj);
}
function setPath(obj, path, value){
  var keys = path.split('.');
  var o = obj;
  for (var i=0;i<keys.length-1;i++){ o = o[keys[i]]; }
  o[keys[keys.length-1]] = value;
}
function linesToList(text){
  return (text||'').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
}

function loadAutosave(){
  try{
    var raw = localStorage.getItem(LS_AUTOSAVE);
    if (!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function autosave(){
  try{ localStorage.setItem(LS_AUTOSAVE, JSON.stringify(state)); }catch(e){}
}
function loadDrafts(){
  try{
    var raw = localStorage.getItem(LS_DRAFTS);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveDrafts(drafts){
  try{ localStorage.setItem(LS_DRAFTS, JSON.stringify(drafts)); }catch(e){}
}

var state = loadAutosave() || defaultState();
var currentStepIndex = 0;

function onStateChange(){ autosave(); updatePreview(); }

function wireInputs(container){
  container.querySelectorAll('[data-bind]').forEach(function(el){
    var path = el.getAttribute('data-bind');
    var current = getPath(state, path);
    if (el.type === 'checkbox'){
      el.checked = !!current;
      el.addEventListener('change', function(){ setPath(state, path, el.checked); onStateChange(); });
    } else {
      el.value = (current === undefined || current === null) ? '' : current;
      var evt = (el.tagName === 'SELECT' || el.type === 'color') ? 'change' : 'input';
      el.addEventListener(evt, function(){
        var v = el.value;
        if (el.type === 'number') v = (v === '' ? '' : Number(v));
        setPath(state, path, v);
        onStateChange();
      });
    }
  });
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1600);
}

function shadowFor(key){
  return { none:'none', soft:'0 1px 3px rgba(0,0,0,.08)', medium:'0 4px 10px rgba(0,0,0,.12)', strong:'0 10px 24px rgba(0,0,0,.18)' }[key] || 'none';
}

function updatePreview(){
  var c = state.colors, t = state.typography, fx = state.effects, comp = state.components;
  var card = document.getElementById('previewCard');
  card.style.background = c.bg; card.style.color = c.text;

  document.getElementById('swPrimary').style.background = c.primary;
  document.getElementById('swSecondary').style.background = c.secondary;
  document.getElementById('swNeutral900').style.background = c.neutral900;
  document.getElementById('swNeutral100').style.background = c.neutral100;

  var hl = document.getElementById('prevHeadline');
  hl.textContent = state.client.businessName || 'Your Business Name';
  hl.style.fontFamily = state.brand.fontName || 'inherit';
  hl.style.fontSize = t.h1.desktop + 'px';
  hl.style.fontWeight = t.h1.weight;
  hl.style.lineHeight = t.h1.lh;
  hl.style.color = c.text;

  var bd = document.getElementById('prevBody');
  bd.style.fontFamily = state.brand.fontName || 'inherit';
  bd.style.fontSize = t.body.desktop + 'px';
  bd.style.lineHeight = t.body.lh;
  bd.style.color = c.text;

  var btn = document.getElementById('prevButton');
  btn.style.background = c.primary;
  btn.style.color = '#fff';
  btn.style.height = comp.buttonHeightDesktop + 'px';
  btn.style.borderRadius = comp.buttonRadius + 'px';
  btn.style.paddingLeft = comp.buttonPaddingX + 'px';
  btn.style.paddingRight = comp.buttonPaddingX + 'px';
  btn.style.fontWeight = comp.buttonFontWeight;
  btn.style.fontFamily = state.brand.fontName || 'inherit';

  var mc = document.getElementById('prevMiniCard');
  mc.style.borderRadius = fx.radius + 'px';
  mc.style.padding = comp.cardPadding + 'px';
  mc.style.background = c.neutral100;
  mc.style.border = fx.borderWidth + 'px solid ' + fx.borderColor;
  mc.style.boxShadow = shadowFor(fx.shadow);
  mc.style.color = c.text;
}

// ---------- Step renderers ----------

function fieldText(label, bindPath, opts){
  opts = opts || {};
  var type = opts.type || 'text';
  return '<div class="field"><label>'+label+'</label>' +
    '<input type="'+type+'" data-bind="'+bindPath+'"' + (opts.placeholder ? ' placeholder="'+opts.placeholder+'"' : '') + '>' +
    (opts.sub ? '<div class="sub">'+opts.sub+'</div>' : '') + '</div>';
}
function fieldTextarea(label, bindPath, opts){
  opts = opts || {};
  return '<div class="field"><label>'+label+'</label>' +
    '<textarea data-bind="'+bindPath+'"' + (opts.placeholder ? ' placeholder="'+opts.placeholder+'"' : '') + '></textarea>' +
    (opts.sub ? '<div class="sub">'+opts.sub+'</div>' : '') + '</div>';
}
function fieldSelect(label, bindPath, options, opts){
  opts = opts || {};
  var optsHtml = options.map(function(o){ return '<option value="'+o.value+'">'+o.label+'</option>'; }).join('');
  return '<div class="field"><label>'+label+'</label><select data-bind="'+bindPath+'">'+optsHtml+'</select>' +
    (opts.sub ? '<div class="sub">'+opts.sub+'</div>' : '') + '</div>';
}
function fieldNumber(label, bindPath){
  return '<div class="field"><label>'+label+'</label><input type="number" data-bind="'+bindPath+'"></div>';
}
function fieldColor(label, bindPath){
  return '<div class="color-field"><label>'+label+'</label><input type="color" data-bind="'+bindPath+'"></div>';
}

var STEPS = [
  { title:'Client & Business', render: renderClientStep },
  { title:'Brand & Look', render: renderBrandStep },
  { title:'Colors', render: renderColorsStep, after: afterColorsStep },
  { title:'Typography', render: renderTypographyStep },
  { title:'Layout & Spacing', render: renderLayoutStep },
  { title:'Effects', render: renderEffectsStep },
  { title:'Components', render: renderComponentsStep },
  { title:'Pages & Sections', render: renderPagesStep, after: afterPagesStep },
  { title:'Motion', render: renderMotionStep },
  { title:'Output', render: renderOutputStep, after: afterOutputStep }
];

function renderClientStep(){
  return '<h2>Client & Business</h2>' +
  '<div class="hint">Basic facts about the business this brief is for.</div>' +
  fieldText('Business name', 'client.businessName', {placeholder:'e.g. Rahman Plumbing Services'}) +
  '<div class="row">' +
    fieldText('Phone (for click-to-call)', 'client.phone', {type:'tel', placeholder:'+8801XXXXXXXXX'}) +
    fieldText('Address', 'client.address', {placeholder:'Street, City'}) +
  '</div>' +
  fieldText('Business hours', 'client.hours', {placeholder:'Sat–Thu 9am–8pm, Fri closed'}) +
  fieldTextarea('Goals', 'client.goals', {placeholder:'What should this website achieve?'}) +
  fieldTextarea('Target audience', 'client.audience') +
  fieldText('Current site (if any)', 'client.currentSite', {placeholder:'https://...'}) +
  fieldTextarea('Reference sites (one per line)', 'client.referenceSites') +
  fieldTextarea('Services offered (one per line)', 'client.services', {sub:'Each becomes its own Service page, same structure.'}) +
  fieldTextarea('Service areas (one per line)', 'client.serviceAreas', {sub:'Each becomes its own Service Area page, same structure.'});
}

function renderBrandStep(){
  var imgs = state.brand.referenceImages.map(function(img, i){
    return '<div class="thumb"><img src="'+img.dataUrl+'" alt="'+img.name+'"><button type="button" data-remove-img="'+i+'">×</button></div>';
  }).join('');
  return '<h2>Brand & Look</h2>' +
  '<div class="hint">How should this site feel, and what should it borrow visually?</div>' +
  fieldText('Font name', 'brand.fontName', {placeholder:'e.g. Inter, Poppins, Lora', sub:'Used in the live preview and written into the brief. Browser will fall back if not installed.'}) +
  fieldTextarea('Tone', 'brand.tone', {placeholder:'e.g. Friendly and trustworthy, no corporate jargon'}) +
  fieldTextarea('Likes (styles/sites/colors you like)', 'brand.likes') +
  fieldTextarea('Dislikes (avoid these)', 'brand.dislikes') +
  fieldTextarea('Overall look description', 'brand.lookDescription', {placeholder:'Describe the look in your own words — this goes straight into the brief.'}) +
  '<div class="field"><label>Reference images</label>' +
  '<input type="file" id="imgUpload" accept="image/*" multiple>' +
  '<div class="sub">Images are embedded directly into the brief (base64) so it stays one shareable file. Keep them small/compressed.</div>' +
  '<div class="image-thumbs" id="imgThumbs">'+imgs+'</div></div>';
}

function renderColorsStep(){
  var c = state.colors;
  var presetOpts = Object.keys(COLOR_PRESETS).map(function(k){ return '<option value="'+k+'"'+(k===c.preset?' selected':'')+'>'+COLOR_PRESET_LABELS[k]+'</option>'; }).join('');
  return '<h2>Colors</h2>' +
  '<div class="hint">Pick a preset to start, then override any swatch.</div>' +
  '<div class="field"><label>Preset</label><select id="colorPresetSelect">'+presetOpts+'</select></div>' +
  fieldSelect('Mode', 'colors.mode', [{value:'light',label:'Light'},{value:'dark',label:'Dark'}]) +
  fieldColor('Primary', 'colors.primary') +
  fieldColor('Secondary / accent', 'colors.secondary') +
  fieldColor('Neutral — dark (text/headings)', 'colors.neutral900') +
  fieldColor('Neutral — light (backgrounds)', 'colors.neutral100') +
  fieldColor('Page background', 'colors.bg') +
  fieldColor('Body text', 'colors.text');
}
function afterColorsStep(container){
  var sel = container.querySelector('#colorPresetSelect');
  sel.addEventListener('change', function(){
    var preset = COLOR_PRESETS[sel.value];
    Object.assign(state.colors, deepClone(preset));
    state.colors.preset = sel.value;
    onStateChange();
    renderCurrentStep();
  });
}

function renderTypographyStep(){
  var rows = TYPO_ORDER.map(function(key){
    return '<tr><td>'+TYPO_LABELS[key]+'</td>' +
      '<td><input type="number" data-bind="typography.'+key+'.desktop"></td>' +
      '<td><input type="number" data-bind="typography.'+key+'.tablet"></td>' +
      '<td><input type="number" data-bind="typography.'+key+'.mobile"></td>' +
      '<td><input type="number" data-bind="typography.'+key+'.weight"></td>' +
      '<td><input type="number" step="0.05" data-bind="typography.'+key+'.lh"></td></tr>';
  }).join('');
  return '<h2>Typography</h2>' +
  '<div class="hint">Pre-filled with a sensible standard scale (base 16px). Override anything you need.</div>' +
  '<table class="tokens"><thead><tr><th>Element</th><th>Desktop px</th><th>Tablet px</th><th>Mobile px</th><th>Weight</th><th>Line-height</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function renderLayoutStep(){
  var l = state.layout;
  return '<h2>Layout & Spacing</h2>' +
  '<div class="hint">Container, grid and section rhythm — pre-filled, override if needed.</div>' +
  '<div class="row">' + fieldNumber('Container max-width (px)', 'layout.containerMax') + fieldNumber('Grid columns', 'layout.gridCols') + '</div>' +
  '<div class="row">' + fieldNumber('Grid gap desktop (px)', 'layout.gridGap') + fieldNumber('Grid gap mobile (px)', 'layout.gridGapMobile') + '</div>' +
  '<div class="row">' + fieldNumber('Side gutter desktop (px)', 'layout.gutterDesktop') + fieldNumber('Side gutter mobile (px)', 'layout.gutterMobile') + '</div>' +
  fieldText('Spacing scale (px, comma separated)', 'layout.spacingScale') +
  '<div class="row">' +
    fieldNumber('Section padding desktop (px)', 'layout.sectionPaddingDesktop') +
    fieldNumber('Section padding tablet (px)', 'layout.sectionPaddingTablet') +
    fieldNumber('Section padding mobile (px)', 'layout.sectionPaddingMobile') +
  '</div>' +
  '<div class="row">' + fieldNumber('Breakpoint — mobile/tablet (px)', 'layout.breakpointMobile') + fieldNumber('Breakpoint — tablet/desktop (px)', 'layout.breakpointTablet') + '</div>';
}

function renderEffectsStep(){
  return '<h2>Effects</h2>' +
  '<div class="hint">Corner rounding, shadow depth and borders used across the site.</div>' +
  fieldNumber('Corner radius (px)', 'effects.radius') +
  fieldSelect('Shadow depth', 'effects.shadow', [{value:'none',label:'None'},{value:'soft',label:'Soft'},{value:'medium',label:'Medium'},{value:'strong',label:'Strong'}]) +
  fieldNumber('Border width (px)', 'effects.borderWidth') +
  fieldColor('Border color', 'effects.borderColor');
}

function renderComponentsStep(){
  return '<h2>Components</h2>' +
  '<div class="hint">Button, input, card and the all-important call button.</div>' +
  '<div class="row">' + fieldNumber('Button height — desktop (px)', 'components.buttonHeightDesktop') + fieldNumber('Button height — mobile (px)', 'components.buttonHeightMobile') + '</div>' +
  '<div class="row">' + fieldNumber('Button radius (px)', 'components.buttonRadius') + fieldNumber('Button horizontal padding (px)', 'components.buttonPaddingX') + fieldNumber('Button font weight', 'components.buttonFontWeight') + '</div>' +
  fieldNumber('Input height (px)', 'components.inputHeight') +
  '<div class="row">' + fieldNumber('Card radius (px)', 'components.cardRadius') + fieldNumber('Card padding (px)', 'components.cardPadding') + '</div>' +
  fieldSelect('Call button style', 'components.callButtonStyle', [
    {value:'floatingMobile',label:'Floating / sticky on mobile'},
    {value:'headerSticky',label:'Sticky in header on all sizes'},
    {value:'both',label:'Both: header button + mobile floating bar'}
  ], {sub:'Local-business sites: this is usually the single most important CTA.'}) +
  fieldSelect('Icon style', 'components.iconStyle', [{value:'outline',label:'Outline'},{value:'filled',label:'Filled'}]) +
  fieldSelect('Avatar shape', 'components.avatarShape', [{value:'circle',label:'Circle'},{value:'roundedSquare',label:'Rounded square'}]);
}

function renderPagesStep(){
  var html = '<h2>Pages & Sections</h2>' +
    '<div class="hint">Fixed to the Local Business structure. Toggle sections, pick a layout variant per page, add notes.</div>';
  PAGE_ORDER.forEach(function(id){
    var cfg = PAGES_CONFIG[id];
    var p = state.pages[id];
    var variantOpts = cfg.variants.map(function(v){ return '<option value="'+v+'"'+(v===p.variant?' selected':'')+'>'+v+'</option>'; }).join('');
    var sectionChecks = cfg.sections.map(function(s){
      return '<label><input type="checkbox" data-bind="pages.'+id+'.sections.'+s.key+'"> '+s.label+'</label>';
    }).join('');
    html += '<details class="page-block" open>' +
      '<summary><label style="font-weight:700;"><input type="checkbox" data-bind="pages.'+id+'.include" style="margin-right:6px;">'+cfg.label+'</label></summary>' +
      '<div class="field" style="margin-top:10px;"><label>Layout variant</label><select data-bind="pages.'+id+'.variant">'+variantOpts+'</select></div>' +
      '<div class="sections-list">'+sectionChecks+'</div>' +
      '<div class="field"><label>Notes for this page</label><textarea data-bind="pages.'+id+'.notes" placeholder="Anything specific for this page..."></textarea></div>' +
      '</details>';
  });
  return html;
}
function afterPagesStep(){ /* variant selects need fresh options reflecting state on re-render; handled by full re-render on include toggle via wireInputs, nothing extra needed */ }

function renderMotionStep(){
  return '<h2>Motion</h2>' +
  '<div class="hint">Keep this subtle for local-business sites — it should feel trustworthy, not flashy.</div>' +
  '<div class="field"><label><input type="checkbox" data-bind="motion.enableMotion"> Enable motion/animation</label></div>' +
  fieldSelect('Hover style', 'motion.hoverStyle', [{value:'lift',label:'Lift (slight raise + shadow)'},{value:'scale',label:'Scale up slightly'},{value:'underline',label:'Underline / color shift'},{value:'none',label:'None'}]) +
  fieldSelect('Scroll animation', 'motion.scrollAnimation', [{value:'fadeUp',label:'Fade up on scroll'},{value:'fadeIn',label:'Fade in on scroll'},{value:'none',label:'None'}]);
}

function renderOutputStep(){
  return '<h2>Output</h2>' +
  fieldSelect('Build target', 'output.buildTarget', [{value:'htmlCss',label:'HTML / CSS'},{value:'reactNext',label:'React / Next.js'}]) +
  '<div class="output-actions">' +
    '<button class="primary" id="btnGenerate">Generate brief</button>' +
    '<button id="btnCopy">Copy</button>' +
    '<button id="btnDownload">Download .md</button>' +
  '</div>' +
  '<textarea id="briefOutput" readonly></textarea>';
}
function afterOutputStep(container){
  var out = container.querySelector('#briefOutput');
  out.value = generateMarkdown();
  container.querySelector('#btnGenerate').addEventListener('click', function(){ out.value = generateMarkdown(); showToast('Brief regenerated'); });
  container.querySelector('#btnCopy').addEventListener('click', function(){
    navigator.clipboard.writeText(out.value).then(function(){ showToast('Copied to clipboard'); }).catch(function(){ out.select(); document.execCommand('copy'); showToast('Copied'); });
  });
  container.querySelector('#btnDownload').addEventListener('click', function(){
    var blob = new Blob([out.value], {type:'text/markdown'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (state.client.businessName || 'design-brief').replace(/[^a-z0-9\-]+/gi,'-').toLowerCase() + '-brief.md';
    document.body.appendChild(a); a.click(); a.remove();
  });
}

// ---------- Markdown generation ----------

function generateMarkdown(){
  var s = state;
  var lines = [];
  lines.push('# ' + (s.client.businessName || 'Untitled Business') + ' — Website Design Brief');
  lines.push('_Generated ' + new Date().toISOString().slice(0,10) + '_');
  lines.push('');
  lines.push('## 1. Business Overview');
  lines.push('- **Business:** ' + (s.client.businessName || '—'));
  lines.push('- **Phone:** ' + (s.client.phone || '—'));
  lines.push('- **Address:** ' + (s.client.address || '—'));
  lines.push('- **Hours:** ' + (s.client.hours || '—'));
  lines.push('- **Goals:** ' + (s.client.goals || '—'));
  lines.push('- **Target audience:** ' + (s.client.audience || '—'));
  lines.push('- **Current site:** ' + (s.client.currentSite || '—'));
  var refSites = linesToList(s.client.referenceSites);
  lines.push('- **Reference sites:** ' + (refSites.length ? refSites.join(', ') : '—'));
  var services = linesToList(s.client.services);
  lines.push('- **Services offered:** ' + (services.length ? services.join(', ') : '—'));
  var areas = linesToList(s.client.serviceAreas);
  lines.push('- **Service areas:** ' + (areas.length ? areas.join(', ') : '—'));
  lines.push('');

  lines.push('## 2. Brand & Look');
  lines.push('- **Font:** ' + (s.brand.fontName || '—'));
  lines.push('- **Tone:** ' + (s.brand.tone || '—'));
  lines.push('- **Likes:** ' + (s.brand.likes || '—'));
  lines.push('- **Dislikes:** ' + (s.brand.dislikes || '—'));
  lines.push('- **Look description:** ' + (s.brand.lookDescription || '—'));
  if (s.brand.referenceImages.length){
    lines.push('');
    lines.push('**Reference images:**');
    s.brand.referenceImages.forEach(function(img, i){
      lines.push('');
      lines.push('![' + (img.name || ('reference-' + (i+1))) + '](' + img.dataUrl + ')');
    });
  }
  lines.push('');

  lines.push('## 3. Design Tokens');
  lines.push('');
  lines.push('### Colors (mode: ' + s.colors.mode + ')');
  lines.push('| Token | Value |');
  lines.push('|---|---|');
  lines.push('| Primary | ' + s.colors.primary + ' |');
  lines.push('| Secondary / accent | ' + s.colors.secondary + ' |');
  lines.push('| Neutral (dark / text-headings) | ' + s.colors.neutral900 + ' |');
  lines.push('| Neutral (light / backgrounds) | ' + s.colors.neutral100 + ' |');
  lines.push('| Page background | ' + s.colors.bg + ' |');
  lines.push('| Body text | ' + s.colors.text + ' |');
  lines.push('');
  lines.push('### Typography (font: ' + (s.brand.fontName || '—') + ', base 16px)');
  lines.push('| Element | Desktop | Tablet | Mobile | Weight | Line-height |');
  lines.push('|---|---|---|---|---|---|');
  TYPO_ORDER.forEach(function(key){
    var t = s.typography[key];
    lines.push('| ' + TYPO_LABELS[key] + ' | ' + t.desktop + 'px | ' + t.tablet + 'px | ' + t.mobile + 'px | ' + t.weight + ' | ' + t.lh + ' |');
  });
  lines.push('');
  lines.push('### Layout & Spacing');
  lines.push('- Container max-width: ' + s.layout.containerMax + 'px, ' + s.layout.gridCols + '-column grid');
  lines.push('- Grid gap: ' + s.layout.gridGap + 'px desktop / ' + s.layout.gridGapMobile + 'px mobile');
  lines.push('- Side gutter: ' + s.layout.gutterDesktop + 'px desktop / ' + s.layout.gutterMobile + 'px mobile');
  lines.push('- Spacing scale (px): ' + s.layout.spacingScale);
  lines.push('- Section top/bottom padding: ' + s.layout.sectionPaddingDesktop + 'px desktop / ' + s.layout.sectionPaddingTablet + 'px tablet / ' + s.layout.sectionPaddingMobile + 'px mobile');
  lines.push('- Breakpoints: mobile < ' + s.layout.breakpointMobile + 'px, tablet ' + s.layout.breakpointMobile + '–' + s.layout.breakpointTablet + 'px, desktop > ' + s.layout.breakpointTablet + 'px');
  lines.push('');
  lines.push('### Effects');
  lines.push('- Corner radius: ' + s.effects.radius + 'px');
  lines.push('- Shadow depth: ' + s.effects.shadow);
  lines.push('- Border: ' + s.effects.borderWidth + 'px solid ' + s.effects.borderColor);
  lines.push('');
  lines.push('### Components');
  lines.push('- Button: height ' + s.components.buttonHeightDesktop + 'px desktop / ' + s.components.buttonHeightMobile + 'px mobile, radius ' + s.components.buttonRadius + 'px, horizontal padding ' + s.components.buttonPaddingX + 'px, weight ' + s.components.buttonFontWeight);
  lines.push('- Input height: ' + s.components.inputHeight + 'px');
  lines.push('- Card: radius ' + s.components.cardRadius + 'px, padding ' + s.components.cardPadding + 'px');
  lines.push('- Call button style: ' + s.components.callButtonStyle + ' (click-to-call is the top-priority CTA on this site type)');
  lines.push('- Icon style: ' + s.components.iconStyle + ' · Avatar shape: ' + s.components.avatarShape);
  lines.push('');

  lines.push('## 4. Site Structure (Local Business)');
  PAGE_ORDER.forEach(function(id){
    var cfg = PAGES_CONFIG[id];
    var p = s.pages[id];
    if (!p.include) return;
    lines.push('');
    lines.push('### ' + cfg.label);
    lines.push('- Layout variant: ' + p.variant);
    var activeSections = cfg.sections.filter(function(sec){ return p.sections[sec.key]; }).map(function(sec){ return sec.label; });
    lines.push('- Sections: ' + (activeSections.length ? activeSections.join(', ') : '—'));
    if (p.notes) lines.push('- Notes: ' + p.notes);
  });
  lines.push('');

  lines.push('## 5. Motion');
  lines.push('- Motion enabled: ' + (s.motion.enableMotion ? 'yes' : 'no'));
  lines.push('- Hover style: ' + s.motion.hoverStyle);
  lines.push('- Scroll animation: ' + s.motion.scrollAnimation);
  lines.push('');

  lines.push('## 6. Build Target');
  var targetLabel = s.output.buildTarget === 'reactNext' ? 'React / Next.js' : 'HTML / CSS';
  lines.push('Build this as a static, multi-page **' + targetLabel + '** website for a local business, using the design tokens and page structure above **consistently across every page** (same header, footer, call button and section styles throughout). Design should look like a typical trustworthy local-business site, not a trendy/modern template.');

  return lines.join('\n');
}

// ---------- Navigation & wiring ----------

function renderStepsNav(){
  var nav = document.getElementById('stepsNav');
  nav.innerHTML = STEPS.map(function(step, i){
    return '<span class="pill clickable' + (i===currentStepIndex ? ' active' : '') + '" data-step="'+i+'">' + (i+1) + '. ' + step.title + '</span>';
  }).join('');
  nav.querySelectorAll('[data-step]').forEach(function(el){
    el.addEventListener('click', function(){ currentStepIndex = Number(el.getAttribute('data-step')); renderCurrentStep(); });
  });
}

function wireImageUpload(container){
  var input = container.querySelector('#imgUpload');
  if (!input) return;
  input.addEventListener('change', function(){
    Array.prototype.forEach.call(input.files, function(file){
      var reader = new FileReader();
      reader.onload = function(){
        state.brand.referenceImages.push({ name:file.name, dataUrl:reader.result });
        onStateChange();
        renderCurrentStep();
      };
      reader.readAsDataURL(file);
    });
  });
  container.querySelectorAll('[data-remove-img]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var idx = Number(btn.getAttribute('data-remove-img'));
      state.brand.referenceImages.splice(idx, 1);
      onStateChange();
      renderCurrentStep();
    });
  });
}

function renderCurrentStep(){
  var pane = document.getElementById('formPane');
  var step = STEPS[currentStepIndex];
  pane.innerHTML = step.render();
  wireInputs(pane);
  wireImageUpload(pane);
  if (step.after) step.after(pane);
  renderStepsNav();
  document.getElementById('stepLabel').textContent = 'Step ' + (currentStepIndex+1) + ' of ' + STEPS.length + ': ' + step.title;
  document.getElementById('btnPrev').disabled = currentStepIndex === 0;
  document.getElementById('btnNext').textContent = (currentStepIndex === STEPS.length - 1) ? 'Done' : 'Next →';
  updatePreview();
  pane.scrollTop = 0;
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

function refreshDraftSelect(){
  var sel = document.getElementById('draftSelect');
  var drafts = loadDrafts();
  var names = Object.keys(drafts);
  sel.innerHTML = '<option value="">— Current / new —</option>' + names.map(function(n){ return '<option value="'+n+'">'+n+'</option>'; }).join('');
}

document.getElementById('btnPrev').addEventListener('click', function(){ if (currentStepIndex > 0){ currentStepIndex--; renderCurrentStep(); } });
document.getElementById('btnNext').addEventListener('click', function(){ if (currentStepIndex < STEPS.length - 1){ currentStepIndex++; renderCurrentStep(); } });

document.getElementById('btnSaveDraft').addEventListener('click', function(){
  var name = window.prompt('Save as (client/business name):', state.client.businessName || '');
  if (!name) return;
  var drafts = loadDrafts();
  drafts[name] = deepClone(state);
  saveDrafts(drafts);
  refreshDraftSelect();
  document.getElementById('draftSelect').value = name;
  showToast('Saved "' + name + '"');
});
document.getElementById('btnDeleteDraft').addEventListener('click', function(){
  var sel = document.getElementById('draftSelect');
  var name = sel.value;
  if (!name) { showToast('Select a saved draft first'); return; }
  if (!window.confirm('Delete draft "' + name + '"? This cannot be undone.')) return;
  var drafts = loadDrafts();
  delete drafts[name];
  saveDrafts(drafts);
  refreshDraftSelect();
  showToast('Deleted "' + name + '"');
});
document.getElementById('draftSelect').addEventListener('change', function(){
  var name = this.value;
  if (!name) return;
  var drafts = loadDrafts();
  if (!drafts[name]) return;
  state = deepClone(drafts[name]);
  currentStepIndex = 0;
  autosave();
  renderCurrentStep();
  showToast('Loaded "' + name + '"');
});
document.getElementById('btnReset').addEventListener('click', function(){
  if (!window.confirm('Reset the current form to defaults? Saved drafts are not affected.')) return;
  state = defaultState();
  currentStepIndex = 0;
  autosave();
  document.getElementById('draftSelect').value = '';
  renderCurrentStep();
  showToast('Reset to defaults');
});

refreshDraftSelect();
renderCurrentStep();

})();
</script>
